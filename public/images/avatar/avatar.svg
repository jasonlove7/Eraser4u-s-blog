<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="头像">
  <title>头像</title>
  <defs>
    <linearGradient id="av-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f3f"/>
      <stop offset="32%" stop-color="#44305c"/>
      <stop offset="58%" stop-color="#7e4574"/>
      <stop offset="82%" stop-color="#c0645c"/>
      <stop offset="100%" stop-color="#e8a15c"/>
    </linearGradient>
    <clipPath id="av-clip">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#av-clip)">
    <rect width="240" height="240" fill="url(#av-sky)"/>

    <!-- 云：两朵，受光面在上、背光面在下 -->
    <g opacity="0.85">
      <ellipse cx="72" cy="78" rx="34" ry="15" fill="#f0d9cf"/>
      <ellipse cx="96" cy="70" rx="26" ry="18" fill="#f6e6dc"/>
      <ellipse cx="118" cy="80" rx="24" ry="13" fill="#e6c8bd"/>
    </g>

    <!-- 地面 -->
    <path d="M0 168h240v72H0z" fill="#1a1830" opacity="0.94"/>

    <!-- 城市剪影 -->
    <g fill="#12111f">
      <rect x="8"   y="140" width="26" height="30"/>
      <rect x="40"  y="126" width="18" height="44"/>
      <rect x="64"  y="148" width="30" height="22"/>
      <rect x="100" y="118" width="22" height="52"/>
      <rect x="128" y="136" width="26" height="34"/>
      <rect x="160" y="146" width="20" height="24"/>
      <rect x="186" y="132" width="28" height="38"/>
    </g>

    <!-- 窗灯 -->
    <g fill="#e8a15c" opacity="0.55">
      <rect x="46" y="136" width="4" height="5"/>
      <rect x="46" y="150" width="4" height="5"/>
      <rect x="106" y="130" width="4" height="5"/>
      <rect x="106" y="148" width="4" height="5"/>
      <rect x="192" y="144" width="4" height="5"/>
      <rect x="192" y="158" width="4" height="5"/>
    </g>

    <!-- 前景电线 -->
    <g stroke="#0f0e18" stroke-width="3" fill="none" opacity="0.72">
      <path d="M0 96q60 22 120 6t120-14"/>
      <path d="M0 112q60 24 120 8t120-16"/>
    </g>
    <rect x="150" y="60" width="7" height="180" fill="#0f0e18" opacity="0.85"/>
  </g>
</svg>
