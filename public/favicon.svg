<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eraser4u's Blog">
  <title>Eraser4u's Blog</title>
  <defs>
    <!-- 与全站一致的天顶→地平线渐变。原创几何，不含任何第三方素材。 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f3f"/>
      <stop offset="30%" stop-color="#44305c"/>
      <stop offset="56%" stop-color="#7e4574"/>
      <stop offset="80%" stop-color="#c0645c"/>
      <stop offset="100%" stop-color="#e8a15c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="10" fill="url(#sky)"/>

  <!-- 地平线以下压暗，形成"天空 / 地面"的分层 -->
  <path d="M0 44h64v10a10 10 0 0 1-10 10H10A10 10 0 0 1 0 54z" fill="#1a1830" opacity="0.92"/>

  <!-- 一层极简的城市剪影 -->
  <g fill="#12111f">
    <rect x="6"  y="38" width="7" height="8"/>
    <rect x="15" y="33" width="5" height="13"/>
    <rect x="22" y="40" width="8" height="6"/>
    <rect x="32" y="30" width="6" height="16"/>
    <rect x="40" y="36" width="7" height="10"/>
    <rect x="49" y="39" width="6" height="7"/>
  </g>

  <!-- 一根电线的弧 —— 本站的招牌元素 -->
  <path d="M0 26q16 6 32 1t32-3" fill="none" stroke="#0f0e18" stroke-width="1.6" opacity="0.7"/>
</svg>
